app = "grassion-worker"
primary_region = "bom"

[build]
  dockerfile = "apps/worker/Dockerfile"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[env]
  NODE_ENV = "production"
  APP_URL = "https://app.grassion.com"

[processes]
  app = "node dist/index.js"

[http_service]
  internal_port = 8081
  force_https = false
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/"

[deploy]
  strategy = "rolling"
