# fly.toml app configuration file generated for grassion-worker on 2026-10-05T17:19:26Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'grassion-worker'
primary_region = 'ams'

[build]
  dockerfile = 'apps/api/Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '3001'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
